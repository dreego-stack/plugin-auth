name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27"
          cache: true
      - name: Validate change file
        if: github.event_name == 'pull_request'
        run: |
          count=$(find .changes -maxdepth 1 -type f -name '*.md' | wc -l)
          test "$count" -eq 1
          grep -Eq '^version: (none|patch)$' .changes/*.md
      - name: Verify modules
        run: go mod tidy && git diff --exit-code
      - name: Vet
        run: go vet ./...
      - name: Test with race detector
        run: go test -race ./...
      - name: Check file size
        run: test -z "$(find . -name '*.go' -not -path './vendor/*' -exec awk 'FNR == 301 { print FILENAME }' {} +)"
      - name: Validate browser JavaScript
        run: for file in client/*.js; do node --check "$file"; done

  compatibility:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27"
          cache: true
      - name: Test against latest Dreego release
        run: |
          go get github.com/dreego-stack/dreego@latest
          go mod tidy
          go test -race ./...

  demo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27"
          cache: true
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"
      - name: Generate Dreego application
        working-directory: demo
        run: go run github.com/dreego-stack/dreego/cli/dreego@v0.7.0 generate
      - name: Test JSON store and application
        working-directory: demo
        run: go test -race ./...
      - name: Validate browser JavaScript
        run: node --check demo/www/static/app.js
      - name: Test demo in Bun WebView
        working-directory: demo
        run: ./e2e/run.sh
      - name: Upload browser diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: demo-browser-diagnostics
          path: demo/.tmp/e2e/
          if-no-files-found: error

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.x"
          cache: true
      - name: Scan reachable vulnerabilities
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...
